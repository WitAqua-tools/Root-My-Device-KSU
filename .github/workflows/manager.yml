name: Manager

# The KernelSU manager, built with the patches in this repository applied to
# ksud and signed with the WitAqua key.
#
# Why it exists: the manager rewrites /data/adb/ksud with the copy bundled in
# its own APK the first time it runs. On a device rooted by Root-My-Device that
# silently reverts the patches in ksud -- measured on Quest 3, where opening the
# official manager undid the soft-reboot module-daemon reap and the next soft
# restart went back to leaving stale daemons behind. A manager whose bundled
# ksud is already the patched one is what makes the patch survive the manager.
#
# It is built here because the patches are here. Nothing is forked: upstream is
# checked out at the revision the patches were written against and they are
# applied to the working tree, the same way Root-My-Device-Payloads builds a
# module, so:
#
#   - `git apply --check` fails the build if the tree is not that revision;
#   - `git rev-list --count HEAD` is untouched, so the manager's versionCode is
#     the upstream one and matches the module Root-My-Device-Payloads builds.
#
# The bundled ksud carries no LKM. Root-My-Device loads the module with its own
# ksud, and the DDK-built module upstream ships would not load on Quest 3
# anyway. This manager is here to keep the daemon on the device patched, not to
# install KernelSU.
#
# Hand-started only, and it publishes only with the box ticked. Leaving the box
# alone is the check -- it builds the manager and runs every assertion on it
# without publishing anything, which is what to do after changing a common
# patch. Nothing runs it on a push: the APK a push produced was thrown away,
# and a patch that lands is followed by a release run anyway, so it was
# building the same thing twice.

on:
  workflow_dispatch:
    inputs:
      ksu_ref:
        description: KernelSU revision to build, and the one the patches must apply to
        required: true
        default: b0bc817b4e966aa6aa830834eaf6ef765d821d40
      release:
        description: publish a GitHub release as well as an artifact
        type: boolean
        default: false

permissions:
  contents: read

# The certificate the modules are built to trust, from
# Android-Keys/kernelsu-manager. KernelSU's module picks its manager by hashing
# the APK's v2 signing certificate and comparing it against EXPECTED_SIZE /
# EXPECTED_HASH compiled in, so an APK signed with anything else is not a
# manager as far as the kernel is concerned -- it just fails to be recognised,
# with nothing in the log to say why. Checked here rather than discovered on a
# device.
env:
  # What the manager is called on the device. From 32567 upstream reads both
  # from gradle properties and ksud from an environment variable; before that
  # the patch set hardcodes them, and passing them anyway is harmless. Either
  # way the APK is checked for them below rather than trusted to have them.
  MANAGER_PACKAGE: org.witaqua.pwn.kernelsu
  MANAGER_NAME: Root My Device KSU
  EXPECTED_CERT_SHA256: 892ea55bd3eeca03d97d52e73c3c16cb3e0ad13f571cdbce8394035249b57002
  EXPECTED_CERT_SIZE: 804
  # What the module can physically read. kernel/manager/apk_sign.c reads the
  # certificate into a fixed buffer before hashing it:
  #
  #     #define CERT_MAX_LENGTH 1024
  #     if (*size4 > CERT_MAX_LENGTH) { pr_info("cert length overlimit"); return false; }
  #
  # A longer certificate is not rejected loudly on a device -- is_manager stays
  # 0 and nothing else is said. The first key here was RSA-4096, 1316 bytes,
  # and no module ever recognised the manager it signed. Checked here so that
  # cannot happen again in silence.
  CERT_MAX_LENGTH: 1024

jobs:
  manager:
    runs-on: ubuntu-latest
    # Only for the release step; the rest of the run needs nothing but a
    # checkout.
    permissions:
      contents: write
    # Everything after the two checkouts happens in the KernelSU tree: its
    # gradle project, its repack script, its cargo workspace.
    defaults:
      run:
        working-directory: kernelsu
    steps:
      - name: Check out the patch sets
        uses: actions/checkout@v6
        with:
          path: patches-repo

      - name: Check out KernelSU at the revision the patches were written against
        uses: actions/checkout@v6
        with:
          repository: tiann/KernelSU
          ref: ${{ inputs.ksu_ref || 'b0bc817b4e966aa6aa830834eaf6ef765d821d40' }}
          path: kernelsu
          fetch-depth: 0

      - name: Apply the common patch set
        run: |
          set -euo pipefail
          # The directory is derived from the checked-out tree, never named
          # here, so a revision with no set fails instead of taking one written
          # against another tree.
          version=$((30000 + $(git rev-list --count HEAD)))
          echo "KernelSU version: $version"
          echo "KSU_VERSION=$version" >> "$GITHUB_ENV"

          # common only, in filename order, the same way Root-My-Device-Payloads
          # applies it. The sets a target names on top of it are kernel-side --
          # devices/quest3 patches the module, not ksud -- so a manager built
          # from common alone carries the same daemon every target's build does.
          # A userspace patch that ever lands in a non-common set breaks that,
          # and this is where to notice.
          set_dir="$GITHUB_WORKSPACE/patches-repo/patches/$version/common"
          test -d "$set_dir" || { echo "::error::no patch set at patches/$version/common"; exit 1; }

          shopt -s nullglob
          patches=("$set_dir"/*.patch)
          test ${#patches[@]} -gt 0 || { echo "::error::patches/$version/common has no patches"; exit 1; }

          for p in "${patches[@]}"; do
            echo "-- $(basename "$p")"
            git apply --check "$p"
            git apply "$p"
          done

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up build-tools
        run: |
          sdkmanager "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Set up Rust
        run: |
          rustup update stable
          rustup target add aarch64-linux-android x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kernelsu/userspace/ksud

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29

      - name: Build the patched ksud
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          KSU_PACKAGE_NAME: ${{ env.MANAGER_PACKAGE }}
        run: |
          set -euo pipefail
          for triple in aarch64-linux-android x86_64-linux-android; do
            # shellcheck disable=SC1091
            source .github/scripts/setup-rust-build.sh "$triple" 26
            cargo build --target "$triple" --release \
              --manifest-path ./userspace/ksud/Cargo.toml
          done

      - name: Write the signing key
        env:
          STORE_FILE: ${{ secrets.STORE_FILE }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$STORE_FILE" || { echo "::error::STORE_FILE is not set"; exit 1; }
          printf '%s' "$STORE_FILE" | base64 -d > key.jks
          {
            echo "KEYSTORE_FILE=$PWD/key.jks"
            echo "KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> manager/gradle.properties

      - name: Build the manager
        working-directory: kernelsu/manager
        run: |
          ./gradlew clean assembleRelease \
            -PKSU_PACKAGE_NAME="$MANAGER_PACKAGE" -PKSU_NAME="$MANAGER_NAME"

      # Gradle's APK carries no ksud; repack_apk.py is what puts one in, which
      # is also how upstream produces the APK it releases.
      - name: Repack with the patched ksud and re-sign
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python3 repack_apk.py repack \
            -b release -t release \
            -a arm64-v8a -a x86_64 \
            -K key.jks -A "$KEY_ALIAS" -P "$STORE_PASSWORD" -S "$KEY_PASSWORD" \
            -n "RootMyDeviceKSU_${KSU_VERSION}"

      - name: Check the APK is the manager the modules look for
        run: |
          set -euo pipefail
          apk=$(find dist -name '*.apk' -type f | head -n 1)
          test -n "$apk" || { echo "::error::repack produced no apk"; exit 1; }
          badging=$(aapt2 dump badging "$apk")
          pkg=$(sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" <<<"$badging")
          label=$(sed -n "s/^application-label:'\\([^']*\\)'.*/\\1/p" <<<"$badging")
          echo "package: $pkg"
          echo "label:   $label"
          # The module is built with KSU_MANAGER_PACKAGE pinned to this, so an
          # APK under any other name is not a manager as far as the kernel is
          # concerned -- and the patch set that renames it differs by upstream
          # version, which is exactly the kind of thing to check rather than
          # assume.
          [ "$pkg" = "$MANAGER_PACKAGE" ] || {
            echo "::error::built as $pkg, but the modules only accept $MANAGER_PACKAGE"; exit 1; }
          [ "$label" = "$MANAGER_NAME" ] || {
            echo "::error::labelled '$label', expected '$MANAGER_NAME'"; exit 1; }

      - name: Check the APK is signed with the certificate the modules trust
        env:
          STORE_FILE: ${{ secrets.STORE_FILE }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          apk=$(find dist -name '*.apk' -type f | head -n 1)
          test -n "$apk" || { echo "::error::repack produced no apk"; exit 1; }
          echo "apk: $apk"

          certs=$(apksigner verify --print-certs "$apk" 2>&1) || {
            echo "$certs"; echo "::error::apksigner could not read $apk"; exit 1; }
          got=$(sed -n 's/.*certificate SHA-256 digest: *//p' <<<"$certs" | head -1)
          if [ -z "$got" ]; then
            echo "$certs"; echo "::error::apksigner printed no certificate digest"; exit 1
          fi

          if [ "$got" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::signed with $got, but the modules are built to trust $EXPECTED_CERT_SHA256"
            echo "::error::either the wrong key is in the secrets, or every module carrying the old pair has to be rebuilt"
            exit 1
          fi

          # The size is the other half of the pair, and the half with a ceiling.
          # Read it off the key rather than trusting the number above.
          printf '%s' "$STORE_FILE" | base64 -d > check.jks
          keytool -exportcert -alias "$KEY_ALIAS" -keystore check.jks \
            -storepass "$STORE_PASSWORD" -file cert.der 2>/dev/null
          size=$(stat -c%s cert.der)
          rm -f check.jks cert.der
          echo "certificate: $got, $size bytes of DER"
          [ "$size" = "$EXPECTED_CERT_SIZE" ] || {
            echo "::error::the certificate is $size bytes, not $EXPECTED_CERT_SIZE"; exit 1; }
          if [ "$size" -gt "$CERT_MAX_LENGTH" ]; then
            echo "::error::$size bytes is past CERT_MAX_LENGTH ($CERT_MAX_LENGTH), so no module can"
            echo "::error::read this certificate at all -- it would be is_manager: 0 and silence"
            exit 1
          fi

      - name: Verify the reap patch is in the bundled ksud
        run: |
          set -euo pipefail
          # Cheap proof that the APK really carries the patched daemon rather
          # than an upstream one: the string only this patch adds.
          if ! grep -qa 'leftover module daemon' target/aarch64-linux-android/release/ksud; then
            echo "::error::the built ksud does not carry common/0004; the patch set did not land"
            exit 1
          fi
          echo "ksud carries the soft-reboot reaper"

      - name: Upload the manager
        uses: actions/upload-artifact@v7
        with:
          name: manager-witaqua-${{ env.KSU_VERSION }}
          path: kernelsu/dist/*.apk

      # Everything above has run and passed by now, so what this adds is only
      # the decision to publish -- which is a person's, because the target's
      # kernelsu.json sends people here to install it.
      - name: Publish a release
        if: ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # This repository's sha, not the KernelSU checkout's. The version
          # already says which upstream revision this is, and the upstream sha
          # does not move when the patches do -- a second release of the same
          # version would collide with the first, which is how this was found.
          tag="manager-${KSU_VERSION}-${GITHUB_SHA::7}"

          cat > notes.md <<NOTES
          Upstream KernelSU $KSU_VERSION with this repository's \`common\` patch
          set applied to ksud, renamed to **$MANAGER_NAME**
          (\`$MANAGER_PACKAGE\`) and signed with the WitAqua key.

          Its bundled ksud is the point: opening the official manager rewrites
          \`/data/adb/ksud\` with the copy inside its own APK, which reverts
          those patches on a device Root-My-Device rooted.

          **This is the only manager the modules accept.** They are built with
          this certificate as the one they look for and with the package name
          above pinned, so the official manager is not rejected on such a
          device -- it is never found. Both can be installed at once; only this
          one is a manager.
          NOTES
          sed -i 's/^          //' notes.md

          gh release create "$tag" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "KernelSU manager $KSU_VERSION (WitAqua)" \
            --notes-file notes.md
